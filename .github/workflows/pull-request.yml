name: Pull Request Checks

on:
  pull_request:
    # opened/reopened: PR created or reopened
    # synchronize: new commits pushed to the PR branch
    types: [opened, synchronize, reopened]

# Cancel the previous run for the same PR when a new push arrives
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install

      - name: Lint
        run: |
          pnpm run lint:lib
          pnpm run lint:demo
          pnpm run prettier:lib
          pnpm run prettier:demo

      - name: Types
        run: |
          pnpm run types:check

      - name: Test
        run: |
          pnpm run test:lib:unit
          pnpm run test:lib:e2e

      - name: Build
        run: pnpm build:lib

