# This workflow will publish a package to npmjs.org when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publishing package to the npm registry

on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            ./packages/fast-sheets
            ./scripts

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      # Runs before the install and the build, so that a release with the wrong version fails early.
      - name: Check the release and choose the npm dist-tag
        id: dist-tag
        run: node scripts/get-npm-dist-tag.js
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:lib

      - name: Publish to npm with Provenance
        run: pnpm stage publish --filter=fast-sheets --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
